<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Viste Lagato · sweater "cuello-alto" (slot sweater). Cielo con canale vertical y cuello alto enrollado.
    Misma estructura y mascara que rayas.svg (cabeza y patitas de la plantilla).
    Contorno 8 px #4A3036, una sombra (negro 15 %) y un brillo (art-direction §3 y §5).
  -->
  <defs>
    <path id="sw-head" d="M256 318 C172 318 96 300 92 232 C88 185 100 150 118 128 C112 104 118 74 134 60 C146 50 160 52 170 62 C184 76 196 90 208 100 C236 94 276 94 304 100 C316 90 328 76 342 62 C352 52 366 50 378 60 C394 74 400 104 394 128 C412 150 424 185 420 232 C416 300 340 318 256 318 Z"/>
    <path id="sw-shape" d="M256 266 C336 266 380 332 382 398 C384 432 378 454 366 468 C330 480 182 480 146 468 C134 454 128 432 130 398 C132 332 176 266 256 266 Z"/>
    <clipPath id="sw-clip"><use href="#sw-shape"/></clipPath>
    <mask id="sw-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use href="#sw-head" fill="#000" stroke="#000" stroke-width="8"/>
      <ellipse class="paw-cut" cx="224" cy="474" rx="38" ry="28" fill="#000"/>
      <ellipse class="paw-cut" cx="288" cy="474" rx="38" ry="28" fill="#000"/>
    </mask>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <g mask="url(#sw-cut)">
      <g clip-path="url(#sw-clip)">
        <rect x="100" y="250" width="312" height="240" fill="#C4E6FF"/>
        <!-- patron -->
<g fill="none" stroke="#A7D6F5" stroke-width="7">
          <path d="M132 340 L132 446"/> <path d="M152 340 L152 446"/> <path d="M172 340 L172 446"/> <path d="M192 340 L192 446"/> <path d="M212 340 L212 446"/> <path d="M232 340 L232 446"/> <path d="M252 340 L252 446"/> <path d="M272 340 L272 446"/> <path d="M292 340 L292 446"/> <path d="M312 340 L312 446"/> <path d="M332 340 L332 446"/> <path d="M352 340 L352 446"/> <path d="M372 340 L372 446"/> <path d="M392 340 L392 446"/>
        </g>
        <!-- elastico inferior -->
        <rect x="100" y="446" width="312" height="40" fill="#A7D6F5"/>
        <path fill="none" stroke="#7FB6DE" stroke-width="5" d="M150 452 L150 474 M170 454 L170 478 M342 454 L342 478 M362 452 L362 474"/>
        <path fill="none" stroke="#4A3036" stroke-width="5" d="M128 446 L384 446"/>
        <!-- sombra unica -->
        <use href="#sw-head" fill="#000" fill-opacity="0.15" transform="translate(0 20)"/>
        <path fill="#000" fill-opacity="0.15" d="M110 440 C170 470 342 470 402 440 L402 500 L110 500 Z"/>
        <!-- cuello elastico -->
        <path fill="none" stroke="#4A3036" stroke-width="72" d="M92 238 C96 306 172 324 256 324 C340 324 416 306 420 238"/>
        <path fill="none" stroke="#A7D6F5" stroke-width="64" d="M92 238 C96 306 172 324 256 324 C340 324 416 306 420 238"/>
        <path fill="none" stroke="#7FB6DE" stroke-width="4" d="M176 322 L176 346 M206 330 L206 352 M236 334 L236 356 M256 335 L256 357 M276 334 L276 356 M306 330 L306 352 M336 322 L336 346"/>
      </g>
      <!-- costuras de las mangas -->
      <path fill="none" stroke="#4A3036" stroke-width="5" d="M168 340 C186 372 194 404 198 436 M344 340 C326 372 318 404 314 436"/>
      <use href="#sw-shape" fill="none" stroke="#4A3036" stroke-width="8"/>
    </g>
    <!-- punos sobre las patitas -->
    <rect x="192" y="430" width="62" height="26" rx="12" fill="#A7D6F5" stroke="#4A3036" stroke-width="8"/>
    <rect x="258" y="430" width="62" height="26" rx="12" fill="#A7D6F5" stroke="#4A3036" stroke-width="8"/>
    <path fill="none" stroke="#7FB6DE" stroke-width="4" d="M210 437 L210 449 M223 437 L223 449 M236 437 L236 449 M276 437 L276 449 M289 437 L289 449 M302 437 L302 449"/>

    <!-- brillo -->
    <ellipse fill="#FFFFFF" fill-opacity="0.5" cx="166" cy="372" rx="8" ry="22" transform="rotate(20 166 372)"/>
    <circle fill="#FFFFFF" fill-opacity="0.5" cx="176" cy="404" r="4"/>
  </g>
</svg>
