<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Viste Lagato · cara "feliz" (capa intercambiable, art-direction v2 §2). Ojos de arco cerrado y boca abierta contenta. Ojos centrados en (192, 224) y (320, 224): los lentes calzan. Sin mejillas ni :3. Los trazos de ojos y boca llevan debajo un halo blanco al 50% (4 px más ancho) para leerse en pelajes oscuros (F12.R A1). -->
<g stroke-linejoin="round" stroke-linecap="round">
  <!-- bigotes: finos y algo curvos, tres por lado -->
  <g fill="none" stroke="#1F1B1A" stroke-width="3.5">
    <path d="M128 238 Q114 230 102 231 M128 249 Q113 247 100 251 M128 260 Q115 262 104 268"/>
    <path d="M384 238 Q398 230 410 231 M384 249 Q399 247 412 251 M384 260 Q397 262 408 268"/>
  </g>
  <g data-eye="l" data-c="192 224">
    <path class="halo" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="10.5" d="M172 230 C178 207 206 207 212 230"/>
    <path class="arc" fill="none" stroke="#1F1B1A" stroke-width="6.5" d="M172 230 C178 207 206 207 212 230"/>
  </g>
  <g data-eye="r" data-c="320 224">
    <path class="halo" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="10.5" d="M300 230 C306 207 334 207 340 230"/>
    <path class="arc" fill="none" stroke="#1F1B1A" stroke-width="6.5" d="M300 230 C306 207 334 207 340 230"/>
  </g>
  <!-- nariz triangular chica -->
  <path class="nose" fill="#D9A48C" stroke="#1F1B1A" stroke-width="3" d="M245 238 C251 234 261 234 267 238 C265 246 259 251 256 253 C253 251 247 246 245 238 Z"/>
  <!-- boca abierta -->
  <path class="halo" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="8.5" d="M238 262 C240 284 272 284 274 262 C266 269 246 269 238 262 Z"/>
    <path class="mouth-open" fill="#C2306B" stroke="#1F1B1A" stroke-width="4.5" d="M238 262 C240 284 272 284 274 262 C266 269 246 269 238 262 Z"/>
  <path fill="none" stroke="#1F1B1A" stroke-width="4.5" d="M256 253 L256 264"/>
</g>
</svg>
