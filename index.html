<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Viste Lagato" />
    <meta name="theme-color" content="#FFFCF5" />
    <meta name="description" content="Viste Lagato: un juego para vestir gatitos con sweaters, de Lagatovino." />
    <link rel="stylesheet" href="/style.css">
    <title>Viste Lagato · Lagatovino</title>
</head>

<body>
    <div id="page">
        <!-- Lagatovino header (ADR 0023): the page around the game, styled like lagatovino.com. -->
        <header class="site-header">
            <div class="site-header-inner">
                <a class="brand" href="https://lagatovino.com/" data-home aria-label="Lagatovino, volver al inicio">
                    <img src="/brand/lagatovino-logo.svg" alt="Lagatovino" width="648" height="100">
                </a>
                <p class="site-title"><span class="spark" aria-hidden="true">&#10022;</span> Viste Lagato</p>
                <div class="site-actions">
                    <a class="pill pill-outline" id="page-home" href="https://lagatovino.com/" data-home aria-label="Volver a Lagatovino">
                        <span aria-hidden="true">&larr;</span><span class="pill-text">Volver a Lagatovino</span>
                    </a>
                    <button type="button" class="pill pill-solid" id="page-fullscreen" aria-pressed="false" aria-label="Pantalla completa">
                        <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span class="pill-text" id="page-fullscreen-label">Pantalla completa</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- The stage is what goes fullscreen: the canvas and the way out (the header and the footer stay behind). -->
        <main id="stage">
            <div id="game-container"></div>
            <button type="button" class="pill pill-solid stage-exit" id="page-fullscreen-exit" aria-label="Salir de pantalla completa">
                <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="pill-text">Salir</span>
            </button>
        </main>

        <footer class="site-footer">
            <div class="stripes" aria-hidden="true"></div>
            <p class="site-footer-inner">
                <span class="hand">Xoxo, mau!</span>
                <span>Gatitos con mucho cariño, de <a href="https://lagatovino.com/" data-home>Lagatovino</a>.</span>
            </p>
        </footer>
    </div>
    <!-- iPhone has no Fullscreen API: this card (opened by the fullscreen button) explains how to play fullscreen. -->
    <div id="a2hs-hint" class="a2hs-hint" role="dialog" aria-label="Jugar a pantalla completa" hidden>
        <div class="rotate-card">
            <svg class="rotate-phone" viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
                <rect x="24" y="30" width="72" height="80" rx="14" fill="#FFFFFF" stroke="#1F1B1A" stroke-width="5"/>
                <path d="M60 12 V62 M44 28 L60 12 L76 28" fill="none" stroke="#1F1B1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="60" cy="88" r="5" fill="#F6BFD0"/>
            </svg>
            <p class="rotate-title">¡A pantalla completa!</p>
            <p class="rotate-text">Toca <strong>Compartir</strong> y luego <strong>Añadir a pantalla de inicio</strong>. Ábrelo desde ahí y los gatitos tendrán toda la pantalla.</p>
            <button type="button" class="pill pill-solid" id="a2hs-hint-close">¡Entendido!</button>
        </div>
    </div>
    <!-- ADR 0014: shown (class rotate-hint on <html>) when a phone is held in portrait. -->
    <div id="rotate-hint" role="alert" aria-live="polite">
        <div class="rotate-card">
            <svg class="rotate-phone" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
                <rect x="30" y="8" width="60" height="104" rx="14" fill="#FFFFFF" stroke="#1F1B1A" stroke-width="5"/>
                <rect x="38" y="22" width="44" height="72" rx="6" fill="#CFE0F3"/>
                <path d="M46 52 L50 38 L58 46 L62 46 L70 38 L74 52 Q74 74 60 74 Q46 74 46 52 Z" fill="#FFFFFF" stroke="#1F1B1A" stroke-width="3.5" stroke-linejoin="round"/>
                <circle cx="54" cy="56" r="2.6" fill="#1F1B1A"/><circle cx="66" cy="56" r="2.6" fill="#1F1B1A"/>
                <path d="M55 62 Q57.5 66 60 62 Q62.5 66 65 62" fill="none" stroke="#1F1B1A" stroke-width="2.6" stroke-linecap="round"/>
                <circle cx="60" cy="102" r="3.2" fill="#F6BFD0"/>
            </svg>
            <p class="rotate-title">Gira tu teléfono</p>
            <p class="rotate-text">¡Los gatitos se visten mejor en horizontal!</p>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
