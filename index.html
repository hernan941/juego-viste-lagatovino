<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF0F6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css">
    <title>Viste Lagato</title>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
    </div>
    <!-- ADR 0014: shown (class rotate-hint on <html>) when a phone is held in portrait. -->
    <div id="rotate-hint" role="alert" aria-live="polite">
        <div class="rotate-card">
            <svg class="rotate-phone" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
                <rect x="30" y="8" width="60" height="104" rx="14" fill="#FFF7EC" stroke="#4A3036" stroke-width="5"/>
                <rect x="38" y="22" width="44" height="72" rx="6" fill="#FFD1E3"/>
                <path d="M46 52 L50 38 L58 46 L62 46 L70 38 L74 52 Q74 74 60 74 Q46 74 46 52 Z" fill="#FFF7EC" stroke="#4A3036" stroke-width="3.5" stroke-linejoin="round"/>
                <circle cx="54" cy="56" r="2.6" fill="#4A3036"/><circle cx="66" cy="56" r="2.6" fill="#4A3036"/>
                <path d="M55 62 Q57.5 66 60 62 Q62.5 66 65 62" fill="none" stroke="#4A3036" stroke-width="2.6" stroke-linecap="round"/>
                <circle cx="60" cy="102" r="3.2" fill="#FF8FB8"/>
            </svg>
            <p class="rotate-title">Gira tu teléfono</p>
            <p class="rotate-text">¡Los gatitos se visten mejor en horizontal!</p>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
