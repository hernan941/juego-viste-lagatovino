<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Viste Lagato · sweater "hoodie-orejitas" (slot sweater). Hoodie lavanda con capucha de orejitas de gato, cordones y bolsillo canguro.
    Misma estructura y mascara que rayas.svg (cabeza y patitas de la plantilla).
    Contorno 8 px #4A3036, una sombra (negro 15 %) y un brillo (art-direction §3 y §5).
  -->
  <defs>
    <path id="sw-head" d="M256 318 C172 318 96 300 92 232 C88 185 100 150 118 128 C112 104 118 74 134 60 C146 50 160 52 170 62 C184 76 196 90 208 100 C236 94 276 94 304 100 C316 90 328 76 342 62 C352 52 366 50 378 60 C394 74 400 104 394 128 C412 150 424 185 420 232 C416 300 340 318 256 318 Z"/>
    <path id="sw-shape" d="M256 266 C336 266 380 332 382 398 C384 432 378 454 366 468 C330 480 182 480 146 468 C134 454 128 432 130 398 C132 332 176 266 256 266 Z"/>
    <clipPath id="sw-clip"><use href="#sw-shape"/></clipPath>
    <mask id="sw-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use href="#sw-head" fill="#000" stroke="#000" stroke-width="8"/>
      <ellipse class="paw-cut" cx="224" cy="474" rx="38" ry="28" fill="#000"/>
      <ellipse class="paw-cut" cx="288" cy="474" rx="38" ry="28" fill="#000"/>
    </mask>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <g mask="url(#sw-cut)">
      
      <g clip-path="url(#sw-clip)">
        <rect x="100" y="250" width="312" height="240" fill="#D8CCFF"/>
        <!-- patron -->
        <g>
          <!-- bolsillo canguro con orejitas de gato -->
          <path fill="#C7B8FA" stroke="#4A3036" stroke-width="6" d="M190 398 L196 372 C198 368 204 368 208 371 L222 384 L290 384 L304 371 C308 368 314 368 316 372 L322 398 C330 410 330 430 322 442 L190 442 C182 430 182 410 190 398 Z"/>
          <path fill="#FF9EB5" d="M201 386 L203 379 L212 385 Z M311 386 L309 379 L300 385 Z"/>
          <circle cx="236" cy="410" r="4" fill="#33242A"/><circle cx="276" cy="410" r="4" fill="#33242A"/>
          <path fill="none" stroke="#33242A" stroke-width="3.5" d="M247 418 C250 423 254 423 256 419 C258 423 262 423 265 418"/>
          <ellipse cx="222" cy="420" rx="7" ry="4.5" fill="#FF9EB5" opacity="0.7"/><ellipse cx="290" cy="420" rx="7" ry="4.5" fill="#FF9EB5" opacity="0.7"/>
          <path fill="none" stroke="#9E8BE0" stroke-width="3" stroke-dasharray="2 8" d="M196 436 L316 436"/>
        </g>
        <!-- elastico inferior -->
        <rect x="100" y="446" width="312" height="40" fill="#B8A6F2"/>
        <path fill="none" stroke="#9E8BE0" stroke-width="5" d="M150 452 L150 474 M170 454 L170 478 M342 454 L342 478 M362 452 L362 474"/>
        <path fill="none" stroke="#4A3036" stroke-width="5" d="M128 446 L384 446"/>
        <!-- sombra unica -->
        <use href="#sw-head" fill="#000" fill-opacity="0.15" transform="translate(0 20)"/>
        <path fill="#000" fill-opacity="0.15" d="M110 440 C170 470 342 470 402 440 L402 500 L110 500 Z"/>
        <!-- cuello -->
        <path fill="none" stroke="#4A3036" stroke-width="68" d="M92 238 C96 306 172 324 256 324 C340 324 416 306 420 238"/>
        <path fill="none" stroke="#C7B8FA" stroke-width="60" d="M92 238 C96 306 172 324 256 324 C340 324 416 306 420 238"/>
        <path fill="none" stroke="#B8A6F2" stroke-width="4" d="M150 318 L150 340 M186 330 L186 352 M326 330 L326 352 M362 318 L362 340"/>
        <!-- cordones -->
        <path fill="none" stroke="#4A3036" stroke-width="13" d="M236 346 C234 362 236 372 232 384 M276 346 C278 362 276 372 280 384"/>
        <path fill="none" stroke="#FFFDF8" stroke-width="6" d="M236 346 C234 362 236 372 232 384 M276 346 C278 362 276 372 280 384"/>
        <circle cx="232" cy="388" r="8" fill="#FFB3CF" stroke="#4A3036" stroke-width="5"/>
        <circle cx="280" cy="388" r="8" fill="#FFB3CF" stroke="#4A3036" stroke-width="5"/>
      </g>
      <!-- costuras de las mangas -->
      <path fill="none" stroke="#4A3036" stroke-width="5" d="M168 340 C186 372 194 404 198 436 M344 340 C326 372 318 404 314 436"/>
      <use href="#sw-shape" fill="none" stroke="#4A3036" stroke-width="8"/>
    </g>
    <!-- punos sobre las patitas -->
    <rect x="192" y="430" width="62" height="26" rx="12" fill="#B8A6F2" stroke="#4A3036" stroke-width="8"/>
    <rect x="258" y="430" width="62" height="26" rx="12" fill="#B8A6F2" stroke="#4A3036" stroke-width="8"/>
    <path fill="none" stroke="#9E8BE0" stroke-width="4" d="M210 437 L210 449 M223 437 L223 449 M236 437 L236 449 M276 437 L276 449 M289 437 L289 449 M302 437 L302 449"/>

    <!-- brillo -->
    <ellipse fill="#FFFFFF" fill-opacity="0.5" cx="166" cy="372" rx="8" ry="22" transform="rotate(20 166 372)"/>
    <circle fill="#FFFFFF" fill-opacity="0.5" cx="176" cy="404" r="4"/>
  </g>
</svg>
