<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Viste Lagato · sweater "universitario" (slot sweater). Verde estilo universitario con parche de huellita, franjas crema y puños acanalados.
    Misma estructura y mascara que rayas.svg (cabeza y patitas de la plantilla).
    Contorno 8 px #4A3036, una sombra (negro 15 %) y un brillo (art-direction §3 y §5).
  -->
  <defs>
    <path id="sw-head" d="M256 318 C172 318 96 300 92 232 C88 185 100 150 118 128 C112 104 118 74 134 60 C146 50 160 52 170 62 C184 76 196 90 208 100 C236 94 276 94 304 100 C316 90 328 76 342 62 C352 52 366 50 378 60 C394 74 400 104 394 128 C412 150 424 185 420 232 C416 300 340 318 256 318 Z"/>
    <path id="sw-shape" d="M256 266 C336 266 380 332 382 398 C384 432 378 454 366 468 C330 480 182 480 146 468 C134 454 128 432 130 398 C132 332 176 266 256 266 Z"/>
    <clipPath id="sw-clip"><use href="#sw-shape"/></clipPath>
    <mask id="sw-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use href="#sw-head" fill="#000" stroke="#000" stroke-width="8"/>
      <ellipse class="paw-cut" cx="224" cy="474" rx="38" ry="28" fill="#000"/>
      <ellipse class="paw-cut" cx="288" cy="474" rx="38" ry="28" fill="#000"/>
    </mask>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <g mask="url(#sw-cut)">
      
      <g clip-path="url(#sw-clip)">
        <rect x="100" y="250" width="312" height="240" fill="#6CC59A"/>
        <!-- patron -->
        <g>
          <circle cx="256" cy="388" r="40" fill="#FFF7EC" stroke="#4FA77E" stroke-width="6"/>
          <circle cx="256" cy="388" r="31" fill="none" stroke="#6CC59A" stroke-width="3" stroke-dasharray="4 5"/>
          <g transform="translate(256 388) scale(1.15)" fill="#4FA77E"><ellipse cx="0" cy="6" rx="12" ry="9.5"/><ellipse cx="-14" cy="-6" rx="4.6" ry="6" transform="rotate(-20 -14 -6)"/><ellipse cx="-5" cy="-13" rx="4.6" ry="6.4"/><ellipse cx="5" cy="-13" rx="4.6" ry="6.4"/><ellipse cx="14" cy="-6" rx="4.6" ry="6" transform="rotate(20 14 -6)"/></g>
          <rect x="100" y="436" width="312" height="9" fill="#FFF7EC"/>
          <rect x="100" y="420" width="312" height="9" fill="#FFF7EC"/>
        </g>
        <!-- elastico inferior -->
        <rect x="100" y="446" width="312" height="40" fill="#4FA77E"/>
        <path fill="none" stroke="#4FA77E" stroke-width="5" d="M150 452 L150 474 M170 454 L170 478 M342 454 L342 478 M362 452 L362 474"/>
        <path fill="none" stroke="#4A3036" stroke-width="5" d="M128 446 L384 446"/>
        <!-- sombra unica -->
        <use href="#sw-head" fill="#000" fill-opacity="0.15" transform="translate(0 20)"/>
        <path fill="#000" fill-opacity="0.15" d="M110 440 C170 470 342 470 402 440 L402 500 L110 500 Z"/>
        <!-- cuello -->
        <path fill="none" stroke="#4A3036" stroke-width="40" d="M92 238 C96 306 172 324 256 324 C340 324 416 306 420 238"/>
        <path fill="none" stroke="#FFF7EC" stroke-width="32" d="M92 238 C96 306 172 324 256 324 C340 324 416 306 420 238"/>
        <path fill="none" stroke="#4FA77E" stroke-width="4" d="M196 326 L196 336 M226 330 L226 340 M256 331 L256 341 M286 330 L286 340 M316 326 L316 336"/>
        
      </g>
      <!-- costuras de las mangas -->
      <path fill="none" stroke="#4A3036" stroke-width="5" d="M168 340 C186 372 194 404 198 436 M344 340 C326 372 318 404 314 436"/>
      <use href="#sw-shape" fill="none" stroke="#4A3036" stroke-width="8"/>
    </g>
    <!-- punos sobre las patitas -->
    <rect x="192" y="430" width="62" height="26" rx="12" fill="#FFF7EC" stroke="#4A3036" stroke-width="8"/>
    <rect x="258" y="430" width="62" height="26" rx="12" fill="#FFF7EC" stroke="#4A3036" stroke-width="8"/>
    <path fill="none" stroke="#4FA77E" stroke-width="4" d="M210 437 L210 449 M223 437 L223 449 M236 437 L236 449 M276 437 L276 449 M289 437 L289 449 M302 437 L302 449"/>

    <!-- brillo -->
    <ellipse fill="#FFFFFF" fill-opacity="0.5" cx="166" cy="372" rx="8" ry="22" transform="rotate(20 166 372)"/>
    <circle fill="#FFFFFF" fill-opacity="0.5" cx="176" cy="404" r="4"/>
  </g>
</svg>
