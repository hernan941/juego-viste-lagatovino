<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Viste Lagato · sweater "oversize" (slot sweater). Durazno extra grande con cuello vuelto, punto de lana y mangas tan largas que tapan las patitas.
    Misma estructura y mascara que rayas.svg (cabeza y patitas de la plantilla).
    Contorno 8 px #4A3036, una sombra (negro 15 %) y un brillo (art-direction §3 y §5).
  -->
  <defs>
