<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Viste Lagato · head "sombrero-copa". Sombrero de copa lavanda con cinta rosa y una florecita.
    Se dibuja ya en su lugar (lienzo de 512, anclas de art/anchors.json).
    Contorno 8 px #4A3036, una sombra (negro 15 %) y un brillo (art-direction §3 y §5).
  -->
  <defs>
    <path id="tp-crown" d="M196 112 L200 34 C200 22 214 18 256 18 C298 18 312 22 312 34 L316 112 Z"/>
    <clipPath id="tp-clip"><use href="#tp-crown"/></clipPath>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- ala -->
    <ellipse cx="256" cy="116" rx="112" ry="24" fill="#8E7BD8" stroke="#4A3036" stroke-width="8"/>
    <path fill="#000" fill-opacity="0.15" d="M158 124 C190 148 322 148 354 124 C350 138 330 142 256 142 C182 142 162 138 158 124 Z"/>
    <!-- copa -->
    <use href="#tp-crown" fill="#8E7BD8"/>
    <g clip-path="url(#tp-clip)">
      <path fill="#000" fill-opacity="0.15" d="M286 16 L316 16 L322 120 L276 120 C292 90 296 50 286 16 Z"/>
      <rect x="190" y="82" width="132" height="30" fill="#FF8FB8"/>
      <path fill="none" stroke="#F2A9C4" stroke-width="4" d="M190 90 L322 90"/>
    </g>
    <use href="#tp-crown" fill="none" stroke="#4A3036" stroke-width="8"/>
    <path fill="none" stroke="#4A3036" stroke-width="5" d="M196 82 L316 82 M197 112 L315 112"/>
    <!-- tapa -->
    <ellipse cx="256" cy="22" rx="52" ry="9" fill="#A593E8" stroke="#4A3036" stroke-width="7"/>
    <!-- florecita en la cinta -->
    <g><circle cx="296.0" cy="80.6" r="12.6" fill="#FFF7EC" stroke="#4A3036" stroke-width="4"/><circle cx="312.5" cy="92.6" r="12.6" fill="#FFF7EC" stroke="#4A3036" stroke-width="4"/><circle cx="306.2" cy="112.0" r="12.6" fill="#FFF7EC" stroke="#4A3036" stroke-width="4"/><circle cx="285.8" cy="112.0" r="12.6" fill="#FFF7EC" stroke="#4A3036" stroke-width="4"/><circle cx="279.5" cy="92.6" r="12.6" fill="#FFF7EC" stroke="#4A3036" stroke-width="4"/><circle cx="296" cy="98" r="8.4" fill="#FFC27D" stroke="#4A3036" stroke-width="4"/></g>
    <ellipse fill="#FFFFFF" fill-opacity="0.55" cx="222" cy="54" rx="7" ry="20" transform="rotate(0 222 54)"/><circle fill="#FFFFFF" fill-opacity="0.55" cx="222" cy="84" r="4"/>
  </g>
</svg>
