<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Viste Lagato · cara "sorpresa" (capa intercambiable, art-direction v2 §2). Ojos redondos grandes con brillo y boquita en o. Ojos centrados en (192, 224) y (320, 224): los lentes calzan. Sin mejillas ni :3. -->
<g stroke-linejoin="round" stroke-linecap="round">
  <!-- bigotes: finos y algo curvos, tres por lado -->
  <g fill="none" stroke="#1F1B1A" stroke-width="3.5">
    <path d="M128 238 Q114 230 102 231 M128 249 Q113 247 100 251 M128 260 Q115 262 104 268"/>
    <path d="M384 238 Q398 230 410 231 M384 249 Q399 247 412 251 M384 260 Q397 262 408 268"/>
  </g>
  <g data-eye="l" data-c="192 224">
    <circle fill="#1F1B1A" cx="192" cy="224" r="21"/>
    <circle fill="#FFFFFF" cx="184" cy="215" r="8.5"/>
    <circle fill="#FFFFFF" cx="200" cy="234" r="3.5"/>
  </g>
  <g data-eye="r" data-c="320 224">
    <circle fill="#1F1B1A" cx="320" cy="224" r="21"/>
    <circle fill="#FFFFFF" cx="312" cy="215" r="8.5"/>
    <circle fill="#FFFFFF" cx="328" cy="234" r="3.5"/>
  </g>
  <!-- nariz triangular chica -->
  <path class="nose" fill="#D9A48C" stroke="#1F1B1A" stroke-width="3" d="M245 238 C251 234 261 234 267 238 C265 246 259 251 256 253 C253 251 247 246 245 238 Z"/>
  <!-- boca en o -->
  <ellipse class="mouth-o" fill="#C2306B" stroke="#1F1B1A" stroke-width="4.5" cx="256" cy="268" rx="9" ry="11"/>
</g>
</svg>
