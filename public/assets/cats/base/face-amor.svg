<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Viste Lagato · cara "amor" (capa intercambiable, art-direction v2 §2). Ojos de corazón frambuesa con contorno de tinta. Ojos centrados en (192, 224) y (320, 224): los lentes calzan. Sin mejillas ni :3. -->
<g stroke-linejoin="round" stroke-linecap="round">
  <!-- bigotes: finos y algo curvos, tres por lado -->
  <g fill="none" stroke="#1F1B1A" stroke-width="3.5">
    <path d="M128 238 Q114 230 102 231 M128 249 Q113 247 100 251 M128 260 Q115 262 104 268"/>
    <path d="M384 238 Q398 230 410 231 M384 249 Q399 247 412 251 M384 260 Q397 262 408 268"/>
  </g>
  <g data-eye="l" data-c="192 224">
    <path fill="#C2306B" stroke="#1F1B1A" stroke-width="5" d="M192 242 C176 230 166 222 166 210 C166 200 174 194 182 194 C187 194 190 197 192 201 C194 197 197 194 202 194 C210 194 218 200 218 210 C218 222 208 230 192 242 Z"/>
    <circle fill="#FFFFFF" cx="179" cy="206" r="6"/>
  </g>
  <g data-eye="r" data-c="320 224">
    <path fill="#C2306B" stroke="#1F1B1A" stroke-width="5" d="M320 242 C304 230 294 222 294 210 C294 200 302 194 310 194 C315 194 318 197 320 201 C322 197 325 194 330 194 C338 194 346 200 346 210 C346 222 336 230 320 242 Z"/>
    <circle fill="#FFFFFF" cx="307" cy="206" r="6"/>
  </g>
  <!-- nariz triangular chica -->
  <path class="nose" fill="#D9A48C" stroke="#1F1B1A" stroke-width="3" d="M245 238 C251 234 261 234 267 238 C265 246 259 251 256 253 C253 251 247 246 245 238 Z"/>
  <!-- boca: línea en "y" -->
  <path class="mouth-y" fill="none" stroke="#1F1B1A" stroke-width="4.5" d="M256 253 L256 260 M237 264 C246 271 256 267 256 260 C256 267 266 271 275 264"/>
</g>
</svg>
